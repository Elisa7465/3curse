    <div class="content">
        <p class="content-label">
            Тарифный план
        </p>
        
        
        <div class="container">
            <button class="dropdown-button" id="btn">
                <p class="dropdown-title">Подобрать тариф</p>
           
            <i class="bx bx-chevron-down" id="arrow">
                <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1.5L6 6.5L11 1.5" stroke="#354153" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>               
            </i>
            </button>
        
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Dropdown button
                </button>
                <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                  <a class="dropdown-item" href="#">Action</a>
                  <a class="dropdown-item" href="#">Another action</a>
                  <a class="dropdown-item" href="#">Something else here</a>
                </div>
              </div>
        </div>
     
    </div>
    
    <main>
        <article></article>
    </main>
    <footer>
        <p>© Вариант 10. Островский Константин, группа ИСПРВ-17-1</p>
    </footer>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    const dropdownBtn = document.getElementById("btn");
    const dropdownMenu = document.getElementById("dropdown");
    const toggleArrow = document.getElementById("arrow");

    // Функция для переключения отображения выпадающего меню
    const toggleDropdown = function () {
      dropdownMenu.classList.toggle("show");
      toggleArrow.classList.toggle("arrow");
    };

    // Открытие/закрытие меню при клике на кнопку
    dropdownBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      toggleDropdown();
    });

    // Останавливаем закрытие при клике внутри меню
    dropdownMenu.addEventListener("click", function (e) {
      e.stopPropagation();
    });

    // Закрытие меню при клике на любую другую часть страницы
    document.documentElement.addEventListener("click", function () {
      if (dropdownMenu.classList.contains("show")) {
        toggleDropdown();
      }
    });
</script>

</html>
